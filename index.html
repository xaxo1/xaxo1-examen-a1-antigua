 viajes cortos.","En zonas no controladas.","En ninguno de los casos anteriores."],"a":2,"page":5,"source":"CONASET cuestionario enero 2016"},{"id":20,"cat":"Conducta vial","q":"¿De qué forma debes estacionar el vehículo en bajada?","opts":["Solo con freno de mano.","Enganchado en primera marcha.","Con freno de mano y las ruedas delanteras giradas hacia la cuneta."],"a":2,"page":5,"source":"CONASET cuestionario enero 2016"},{"id":21,"cat":"Conducta vial","q":"Puedes conducir tu vehículo en las vías públicas:","opts":["Sin sistemas de frenos.","Con el mecanismo de la dirección en mal estado.","En ninguno de los casos anteriores."],"a":2,"page":6,"source":"CONASET cuestionario enero 2016"},{"id":22,"cat":"Conducta vial","q":"Al transitar con tu vehículo en vías rurales, como norma de carácter general, durante la noche debes hacerlo con:","opts":["Luces altas.","Luces bajas.","Luces de estacionamiento."],"a":0,"page":6,"source":"CONASET cuestionario enero 2016"},{"id":23,"cat":"Conducta vial","q":"Al conducir tu vehículo durante la noche, por regla general, en las zonas urbanas debes hacerlo con:","opts":["Luces de estacionamiento solamente.","Luces altas.","Luces bajas."],"a":2,"page":6,"source":"CONASET cuestionario enero 2016"},{"id":24,"cat":"Conducta vial","q":"Al conducir tu vehículo podrás usar la bocina para:","opts":["Apurar al vehículo que te antecede.","Anunciar que estacionarás.","Prevenir un siniestro, si ello es estrictamente necesario."],"a":2,"page":6,"source":"CONASET cuestionario enero 2016"},{"id":25,"cat":"Conducta vial","q":"Si la parte trasera de tu vehículo patina hacia un costado debes:","opts":["Frenar bruscamente.","Girar las ruedas delanteras en el mismo sentido que se desplaza la parte trasera del vehículo.","Girar las ruedas delanteras en sentido contrario al que se desplaza la parte trasera del vehículo."],"a":1,"page":6,"source":"CONASET cuestionario enero 2016"},{"id":27,"cat":"Conducta vial","q":"¿Cuánto es el espacio lateral que debes "id":35,"cat":"Mecánica básica","q":"Los filtros de combustibles sirven para evitar:","opts":["Desgaste de partes vitales del motor.","Ahogamiento del motor.","Humo en el escape."],"a":0,"page":8,"source":"CONASET cuestionario enero 2016"},{"id":36,"cat":"Mecánica básica","q":"Si el alternador de corriente del vehículo no carga, ¿qué pasa?","opts":["El motor deja de funcionar.","Se descarga la batería.","Se produce un desgaste rápido en los electrodos de las bujías."],"a":1,"page":8,"source":"CONASET cuestionario enero 2016"},{"id":37,"cat":"Mecánica básica","q":"Cuando la rueda del vehículo se calienta, indica que:","opts":["El pedal de freno llega a fondo.","Roza la balata (pastillas) por estar muy ajustadas.","Falta de líquido de frenos."],"a":1,"page":8,"source":"CONASET cuestionario enero 2016"},{"id":38,"cat":"Mecánica básica","q":"El nombre que recibe el marcador de revoluciones del motor es:","opts":["Manómetro.","Tacómetro.","Pluviómetro."],"a":1,"page":8,"source":"CONASET cuestionario enero 2016"},{"id":39,"cat":"Mecánica básica","q":"El nivel correcto del electrolito en una batería es:","opts":["1 cm. bajo nivel de las placas.","Al nivel de las placas.","Sobre 1 cm. del nivel de las placas."],"a":2,"page":8,"source":"CONASET cuestionario enero 2016"},{"id":40,"cat":"Mecánica básica","q":"Si se corta la correa del ventilador:","opts":["El motor no funciona.","El motor se calienta.","El motor funciona solo en baja velocidad."],"a":1,"page":9,"source":"CONASET cuestionario enero 2016"},{"id":41,"cat":"Mecánica básica","q":"La función del embrague es:","opts":["Frenar el motor del vehículo.","Darle fuerza al motor del vehículo.","Conectar y desconectar “la fuerza” del motor a la caja de velocidades."],"a":2,"page":9,"source":"CONASET cuestionario enero 2016"},{"id":42,"cat":"Mecánica básica","q":"Una de las causas de que el motor de arranque no funcione es:","opts":["Cables de las bujías desconectados.","Bobina en mal estado.","Bornes de la batería sulfatados."],"a":2,"page":9,"source":"CONASET cuestionario enero 2016"},{"id":43,"cat":"Mecánica básica","q":"El exceso de inflado en un neumático produce:","opts":["Desgaste en los bordes de la banda de rodamiento.","Desgaste en el centro de la banda de rodamiento del neumático.","Deterioro de la válvula de inflado."],"a":1,"page":9,"source":"CONASET cuestionario enero 2016"},{"id":44,"cat":"Mecánica básica","q":"El desgaste disparejo de los neumáticos delanteros se debe a:","opts":["Exceso de velocidad en zona de curvas.","Exceso de peso en el vehículo.","Deficiente alineación del tren delantero y/o desgaste de amortiguadores."],"a":2,"page":9,"source":"CONASET cuestionario enero 2016"},{"id":45,"cat":"Mecánica básica","q":"El conducir sin retirar totalmente el pie del pedal de embrague produce:","opts":["Desgaste en el motor del vehículo.","Menor fuerza en el motor.","Desgaste prematuro en balata de embrague."],"a":2,"page":9,"source":"CONASET cuestionario enero 2016"},{"id":46,"cat":"Mecánica básica","q":"La excesiva temperatura en la batería puede deberse a:","opts":["Deficiente funcionamiento del regulador de voltaje.","Poca chispa en las bujías.","Demasiada agua destilada."],"a":0,"page":9,"source":"CONASET cuestionario enero 2016"},{"id":47,"cat":"Mecánica básica","q":"Si con el motor funcionando se enciende la luz roja indicadora de presión de aceite, se debe:","opts":["Continuar la marcha.","Detener inmediatamente el vehículo y el motor.","Continuar muy lentamente."],"a":1,"page":9,"source":"CONASET cuestionario enero 2016"},{"id":48,"cat":"Mecánica básica","q":"Circulando con el vehículo se detecta que el motor se sobrecalienta; ello se puede deber a:","opts":["Circuito de refrigeración obstruido.","Insuficiente paso de agua caliente al radiador de la calefacción.","Batería con baja carga."],"a":0,"page":10,"source":"CONASET cuestionario enero 2016"},{"id":49,"cat":"Mecánica básica","q":"Indica el modo más simple de limpiar los bornes sulfatados de la batería:","opts":["Ácido sulfúrico.","Agua con bicarbonato.","Agua destilada."],"a":1,"page":10,"source":"CONASET cuestionario enero 2016"},{"id":50,"cat":"Mecánica básica","q":"Si durante la marcha del vehículo, se desconecta un cable de bujía:","opts":["El motor no funciona.","El motor pierde fuerza.","El motor gira la mitad de las revoluciones normales."],"a":1,"page":10,"source":"CONASET cuestionario enero 2016"},{"id":51,"cat":"Mecánica básica","q":"Si te encuentras bajando por una pendiente pronunciada, debes:","opts":["Utilizar permanentemente el freno de pie.","Enganchar en el cambio de velocidad correspondiente.","Presionar el pedal de embrague."],"a":1,"page":10,"source":"CONASET cuestionario enero 2016"},{"id":52,"cat":"Mecánica básica","q":"Cuando el tubo de escape expele humo “azul” significa que el vehículo está:","opts":["Mal carburado.","Con el motor fuera de punto en el encendido.","Quemando aceite."],"a":2,"page":10,"source":"CONASET cuestionario enero 2016"},{"id":53,"cat":"Mecánica básica","q":"Si el motor está sobrecalentado por falta de agua en el sistema de refrigeración:","opts":["Se debe agregar agua lentamente con el motor funcionando.","No se debe agregar agua.","Se debe agregar agua con el motor detenido."],"a":0,"page":10,"source":"CONASET cuestionario enero 2016"},{"id":54,"cat":"Mecánica básica","q":"Al subir una cuesta en un cambio de velocidad no adecuado se produce:","opts":["Falla en el sistema de frenos.","Falla en la caja de cambios.","Exceso de consumo de combustible."],"a":2,"page":10,"source":"CONASET cuestionario enero 2016"},{"id":55,"cat":"Mecánica básica","q":"Cuando un neumático delantero tiene baja presión:","opts":["La dirección del vehículo tiende hacia un lado.","El motor pierde potencia.","Se sobrecalienta el motor."],"a":0,"page":10,"source":"CONASET cuestionario enero 2016"},{"id":56,"cat":"Mecánica básica","q":"El que los frenos rocen puede deberse a:","opts":["Mala regulación del pedal de freno.","Falta líquido de freno.","Mala regulación de balatas o pastillas."],"a":2,"page":11,"source":"CONASET cuestionario enero 2016"},{"id":57,"cat":"Mecánica básica","q":"Para que las bandas de los neumáticos se desgasten en forma pareja se debe efectuar:","opts":["Un recauchado cada 10.000 kilómetros.","Una rotación periódica.","Un redibujado cada 15.000 kilómetros."],"a":1,"page":11,"source":"CONASET cuestionario enero 2016"},{"id":58,"cat":"Mecánica básica","q":"Antes de poner un vehículo en marcha, quien conduce debe verificar:","opts":["El funcionamiento del tubo de escape.","El funcionamiento del freno, embrague e instrumentos del tablero.","El estado de la carrocería."],"a":1,"page":11,"source":"CONASET cuestionario enero 2016"},{"id":59,"cat":"Mecánica básica","q":"Lo que recibe la fuerza de la explosión en un motor se denomina:","opts":["Pistón.","Biela.","Cigüeñal."],"a":0,"page":11,"source":"CONASET cuestionario enero 2016"},{"id":60,"cat":"Mecánica básica","q":"La función del filtro de aceite es:","opts":["Restituir la viscosidad del aceite.","Retener las partículas gruesas del aceite.","Separar el combustible del aceite."],"a":1,"page":11,"source":"CONASET cuestionario enero 2016"},{"id":61,"cat":"Mecánica básica","q":"La función del filtro de aire es:","opts":["Separar el aire del aceite.","Separar el aire del combustible.","Retener las partículas contenidas en el aire, antes de entrar al carburador."],"a":2,"page":11,"source":"CONASET cuestionario enero 2016"},{"id":62,"cat":"Mecánica básica","q":"La falta de presión de aire en los neumáticos produce:","opts":["Desgaste en el centro de la banda de rodamiento.","Desgaste en los costados de la banda de rodamiento.","Ninguna de las anteriores."],"a":1,"page":11,"source":"CONASET cuestionario enero 2016"},{"id":63,"cat":"Normativa","q":"¿Cuándo las personas que conducen deben mantenerse atentas a las condiciones del tránsito del momento?","opts":["Siempre.","Solo en días de lluvia y niebla.","Solo en la noche."],"a":0,"page":12,"source":"CONASET cuestionario enero 2016"},{"id":64,"cat":"Normativa","q":"Una persona puede manejar un vehículo bajo la influencia del alcohol.","opts":["Nunca.","Solo de día.","Sin estar ebrio."],"a":0,"page":12,"source":"CONASET cuestionario enero 2016"},{"id":65,"cat":"Normativa","q":"En condiciones normales un vehículo podrá ser conducido marcha atrás solo:","opts":["50 metros.","30 metros.","Para mantener la libre circulación o para incorporarse a ella o estacionar un vehículo."],"a":2,"page":12,"source":"CONASET cuestionario enero 2016"},{"id":66,"cat":"Normativa","q":"Los vehículos deberán circular por la mitad derecha de la calzada, salvo en el siguiente caso, entre otros:","opts":["En circulación rural, cuando la velocidad sea menor a 45 km/h.","En circulación urbana, cuando la velocidad sea menor a 45 km/h.","En la circulación urbana, cuando la calzada está exclusivamente señalizada para el tránsito en un solo sentido."],"a":2,"page":12,"source":"CONASET cuestionario enero 2016"},{"id":67,"cat":"Normativa","q":"En vías de doble tránsito, los vehículos que circulen en sentido opuesto, al cruzarse:","opts":["Deberán encender las luces bajas.","Deberán señalizar con los brazos.","No pasarán sobre el eje de la calzada, demarcado o imaginario."],"a":2,"page":12,"source":"CONASET cuestionario enero 2016"},{"id":68,"cat":"Normativa","q":"Quien conduce un vehículo puede sobrepasar a otro por la derecha, cuando:","opts":["El vehículo de adelante va a virar a la derecha.","El vehículo de adelante va a virar a la izquierda.","Nunca."],"a":1,"page":13,"source":"CONASET cuestionario enero 2016"},{"id":69,"cat":"Normativa","q":"No se podrá adelantar en el siguiente caso:","opts":["Al aproximarse a un camión.","Cuando existe eje discontinuo.","Al aproximarse a la cima de una cuesta."],"a":2,"page":13,"source":"CONASET cuestionario enero 2016"},{"id":70,"cat":"Normativa","q":"¿Cuál es la distancia que debe mantener quien conduce respecto al vehículo de adelante?","opts":["30 mt Cuándo se podrán transportar cargas peligrosas en vehículos de alquiler o en los destinados al transporte colectivo?","opts":["Cuando vayan en un envase firme.","Nunca.","Solo cuando el vehículo lleve pocas personas a bordo."],"a":1,"page":14,"source":"CONASET cuestionario enero 2016"},{"id":81,"cat":"Normativa","q":"El color de las luces que proyecten hacia delante los vehículos deben ser:","opts":["Rojas y blancas.","Blancas o amarillas.","Rojas o blancas."],"a":1,"page":14,"source":"CONASET cuestionario enero 2016"},{"id":82,"cat":"Normativa","q":"¿De qué color deben ser las luces de viraje traseras?","opts":["Blancas.","Rojas o amarrillas.","Verdes."],"a":1,"page":14,"source":"CONASET cuestionario enero 2016"},{"id":83,"cat":"Normativa","q":"¿Qué focos o luces se prohíben?","opts":["Los neblineros.","Los busca-caminos.","Todos los que induzcan a error en la conducción."],"a":2,"page":14,"source":"CONASET cuestionario enero 2016"},{"id":84,"cat":"Normativa","q":"Los vehículos deberán llevar encendidas las luces reglamentarias desde:","opts":["Media hora antes de la puesta de sol, hasta media hora antes de su salida.","Media hora después de la puesta de sol, hasta media hora antes de su salida.","Ninguna de las anteriores."],"a":1,"page":15,"source":"CONASET cuestionario enero 2016"},{"id":85,"cat":"Normativa","q":"¿Cuándo se puede hacer uso del aparato sonoro en zona rural?","opts":["Solo en caso necesario.","Al llegar a una curva.","Al entrar a un túnel."],"a":0,"page":15,"source":"CONASET cuestionario enero 2016"},{"id":86,"cat":"Normativa","q":"Los vehículos que tengan sus neumáticos con las bandas de rodadura desgastadas:","opts":["Podrán circular solo de noche.","Podrán circular solo en días despejados.","No podrán circular."],"a":2,"page":15,"source":"CONASET cuestionario enero 2016"},{"id":87,"cat":"Normativa","q":"¿Cuántos sistemas de frenos debe tener un vehículo motorizado?","opts":["A lo menos dos, independientes entre sí.","Dos, conectados entre sí.","A lo menos uno."],"a":0,"page":15,"source":"CONASET cuestionario enero 2016"},{"id":88,"cat":"Normativa","q":"¿Qué tipos de vehículos deben llevar luces amarillas frontales, que indiquen claramente ancho y altura máxima del vehículo?","opts":["Todos los vehículos.","Solo los de carga.","Los vehículos de 2 o más metros de ancho."],"a":2,"page":15,"source":"CONASET cuestionario enero 2016"},{"id":89,"cat":"Normativa","q":"Cuando la situación lo requiera, ¿qué luces debe llevar encendidas el vehículo en las vías públicas urbanas?","opts":["Luces altas.","Luces bajas.","Cualquier tipo de luz."],"a":1,"page":15,"source":"CONASET cuestionario enero 2016"},{"id":90,"cat":"Normativa","q":"Cuando circules de noche por caminos y vías rurales con luces encendidas y no te encuentres próximo ningún otro vehículo, se utilizarán luces:","opts":["Altas y bajas.","Altas.","Bajas."],"a":1,"page":15,"source":"CONASET cuestionario enero 2016"},{"id":91,"cat":"Normativa","q":"¿Qué tipos de luces no se deben usar cuando el vehículo se encuentre en movimiento?","opts":["De estacionamiento.","De freno.","De viraje."],"a":0,"page":15,"source":"CONASET cuestionario enero 2016"},{"id":92,"cat":"Normativa","q":"¿En qué parte del túnel se puede hacer uso del aparato sonoro?","opts":["A la entrada.","A la salida.","En ninguna parte."],"a":2,"page":16,"source":"CONASET cuestionario enero 2016"},{"id":95,"cat":"Normativa","q":"¿Qué características deben cumplir los vidrios de seguridad en un vehículo?","opts":["Permitir relativa visibilidad desde el interior.","Permitir perfecta visibilidad desde el exterior.","Permitir perfecta visibilidad desde y hacia el interior del vehículo."],"a":2,"page":16,"source":"CONASET cuestionario enero 2016"},{"id":96,"cat":"Normativa","q":"¿En qué condiciones debe estar la rueda de repuesto?","opts":["En buen estado.","Redibujada.","Recauchada lisa."],"a":0,"page":16,"source":"CONASET cuestionario enero 2016"},{"id":97,"cat":"Normativa","q":"De los siguientes elementos, ¿cuáles deben portarse en los vehículos de locomoción colectiva y de carga?","opts":["Botiquín y 2 cuñas de seguridad y chaleco reflectante.","Botiquín, 2 cuñas de seguridad, triángulo reflectante, extintor(es) de incendio y chaleco reflectante.","Botiquín, 2 cuñas de seguridad, chaleco reflectante y extintor(es) de incendio."],"a":1,"page":16,"source":"CONASET cuestionario enero 2016"},{"id":98,"cat":"Normativa","q":"La profundidad mínima de las bandas de rodamiento de los neumáticos de taxis debe ser de:","opts":["3 mm.","2 mm.","1,6 mm."],"a":2,"page":16,"source":"CONASET cuestionario enero 2016"},{"id":99,"cat":"Normativa","q":"En el caso de un servicio de transporte público interurbano de pasajeros, ¿cuánto tiempo como mínimo deben mantenerse los registros del tacógrafo o dispositivo electrónico equivalente?","opts":["30 días.","60 días.","90 días."],"a":1,"page":17,"source":"CONASET cuestionario enero 2016"},{"id":100,"cat":"Normativa","q":"Adelantamiento es la maniobra efectuada:","opts":["Por el costado izquierdo del eje de la calzada.","Por la berma del costado derecho.","Por el costado derecho del eje de la calzada."],"a":0,"page":17,"source":"CONASET cuestionario enero 2016"},{"id":101,"cat":"Normativa","q":"Cruce regulado es aquel en que existe:","opts":["Señal PARE o CEDA EL PASO.","Semáforo intermitente.","Semáforo funcionando normalmente o Carabinero dirigiendo el tránsito."],"a":2,"page":17,"source":"CONASET cuestionario enero 2016"},{"id":102,"cat":"Normativa","q":"Derecho preferente de paso es:","opts":["La prerrogativa de un peatón o quien conduce un vehículo para proseguir su marcha.","Virar careciendo de preferencia.","Virar a la izquierda sin detener la marcha."],"a":0,"page":17,"source":"CONASET cuestionario enero 2016"},{"id":103,"cat":"Normativa","q":"El eje de la calzada es:","opts":["La línea perpendicular a la calzada, demarcada o imaginaria que determina las áreas con sentido de tránsito opuesto.","La línea longitudinal a la calzada, demarcada o imaginaria que determina las áreas con sentido de tránsito opuesto.","La línea longitudinal formada por la prolongación de las líneas de edificación."],"a":1,"page":17,"source":"CONASET cuestionario enero 2016"},{"id":104,"cat":"Normativa","q":"Estacionar es:","opts":["Detener momentáneamente un vehículo en la vía pública con o sin la persona que conduce dentro de él.","Ubicar el vehículo en un lugar determinado.","Paralizar un vehículo en la vía pública, con o sin la persona que conduce, por un período mayor que el necesario para dejar o recibir pasajeros."],"a":2,"page":17,"source":"CONASET cuestionario enero 2016"},{"id":105,"cat":"Normativa","q":"Intersección es:","opts":["El área común de calzadas que no se cruzan o divergen.","El área común de calzadas que se cruzan o convergen.","Ninguna de las anteriores."],"a":1,"page":17,"source":"CONASET cuestionario enero 2016"},{"id":106,"cat":"Normativa","q":"Línea de detención de vehículos es:","opts":["La línea transversal a la calzada, demarcada o imaginaria, ubicada antes de un paso para peatones o de una intersección.","El paso de cebra.","La línea imaginaria, ubicada a menos de un metro después del paso de peatones."],"a":0,"page":18,"source":"CONASET cuestionario enero 2016"},{"id":107,"cat":"Normativa","q":"Paso de peatones es:","opts":["La senda de seguridad formada por la prolongación imaginaria o demarcada de la calzada.","La senda formada por la prolongación de las líneas de detención.","La senda de seguridad en la calzada señalizada conforme al reglamento."],"a":2,"page":18,"source":"CONASET cuestionario enero 2016"},{"id":108,"cat":"Normativa","q":"Sobrepasar es:","opts":["Situarse detrás de otro vehículo sobrepasando el eje de la calzada.","Pasar por otro u otros vehículos en el mismo sentido, sin traspasar el eje de la calzada.","Situarse delante de otro vehículo, traspasando el eje de la calzada."],"a":1,"page":18,"source":"CONASET cuestionario enero 2016"},{"id":109,"cat":"Normativa","q":"En un cruce no regulado, ¿qué vehículo deberá ceder el derecho preferente de paso?","opts":["El que llega primero al cruce.","El de la derecha con respecto al que se acerque por la izquierda.","El de la izquierda con respecto al que se acerque por la derecha."],"a":2,"page":18,"source":"CONASET cuestionario enero 2016"},{"id":110,"cat":"Normativa","q":"Una persona que conduce, al enfrentar un signo “PARE”, deberá:","opts":["Proseguir su marcha.","Detenerse.","Encender luces altas."],"a":1,"page":18,"source":"CONASET cuestionario enero 2016"},{"id":111,"cat":"Normativa","q":"Una persona que conduce, al enfrentar un signo “CEDA EL PASO”, deberá:","opts":["Detenerse siempre.","Seguir a la misma velocidad.","Reducir la velocidad y detenerse si fuese necesario."],"a":2,"page":18,"source":"CONASET cuestionario enero 2016"},{"id":112,"cat":"Normativa","q":"Un vehículo que se incorpore a la circulación desde un garage particular, carece del derecho preferente de paso:","opts":["Cuando el vehículo es un camión.","Siempre.","Ninguna de las anteriores."],"a":1,"page":19,"source":"CONASET cuestionario enero 2016"},{"id":113,"cat":"Normativa","q":"Cuando se aproxima un vehículo de emergencia haciendo uso de sus señales audibles y visibles en el mismo sentido, quien conduce deberá:","opts":["Acelerar y circular delante del vehículo de emergencia.","Frenar bruscamente.","Conducir el vehículo lo más a la izquierda o a la derecha posible, con el objeto de despejar la vía."],"a":2,"page":19,"source":"CONASET cuestionario enero 2016"},{"id":114,"cat":"Normativa","q":"Por regla general, los vehículos deberán estacionarse:","opts":["A la derecha de la calzada.","Al centro de la calzada.","A la izquierda de la calzada."],"a":0,"page":19,"source":"CONASET cuestionario enero 2016"},{"id":115,"cat":"Normativa","q":"Solo se podrá estacionar al lado izquierdo de la calzada cuando:","opts":["La señalización lo permita.","No hayan Carabineros en el lugar.","Ninguna de las anteriores."],"a":0,"page":19,"source":"CONASET cuestionario enero 2016"},{"id":116,"cat":"Normativa","q":"En la carretera, los vehículos deberán estacionarse:","opts":["Con la mitad derecha sobre la berma.","Solo con la parte de atrás sobre la calzada.","Con toda su estructura sobre la berma."],"a":2,"page":19,"source":"CONASET cuestionario enero 2016"},{"id":117,"cat":"Normativa","q":"¿Cuál es la distancia máxima a la que deben estacionarse los vehículos de la cuneta?","opts":["20 cm.","60 cm.","30 cm."],"a":2,"page":19,"source":"CONASET cuestionario enero 2016"},{"id":118,"cat":"Normativa","q":"¿Qué deberá hacer quien conduce al estacionar un vehículo motorizado?","opts":["Detener el motor del vehículo","Frenarlo y detener el motor.","Frenar el vehículo."],"a":1,"page":19,"source":"CONASET cuestionario enero 2016"},{"id":119,"cat":"Normativa","q":"La distancia mínima entre un vehículo y otro al estacionarse debe ser de:","opts":["50 cm.","60 cm.","30 cm."],"a":1,"page":20,"source":"CONASET cuestionario enero 2016"},{"id":120,"cat":"Normativa","q":"¿A cuántos metros de un grifo para incendio y de un cuartel de bombas se puede estacionar un vehículo?","opts":["A menos de 6 metros y 5 metros, respectivamente.","A más de un metro y 3 metros, respectivamente.","A más de 5 metros y 10 metros, respectivamente."],"a":2,"page":20,"source":"CONASET cuestionario enero 2016"},{"id":121,"cat":"Normativa","q":"¿A cuántos metros de un cruce ferroviario a nivel se puede estacionar?","opts":["A más de 5 metros.","A más de 20 metros.","A menos de 20 metros."],"a":1,"page":20,"source":"CONASET cuestionario enero 2016"},{"id":122,"cat":"Normativa","q":"¿A cuántos metros de una esquina y de un signo PARE o CEDA EL PASO se puede estacionar un vehículo motorizado?","opts":["A más de 10 metros, en ambos casos.","A menos de 10 a 5 metros, respectivamente.","A más de 5 y 10 metros, respectivamente."],"a":0,"page":20,"source":"CONASET cuestionario enero 2016"},{"id":123,"cat":"Normativa","q":"¿Bajo qué condiciones un estacionamiento reservado puede ser ocupado por cualquier vehículo?","opts":["Siempre que sea el mismo tipo de vehículo.","Nunca, está totalmente prohibido.","Siempre que quien conduce el vehículo permanezca en él y lo retire cuando llegue el vehículo que goce de la reserva."],"a":2,"page":20,"source":"CONASET cuestionario enero 2016"},{"id":124,"cat":"Normativa","q":"¿Cómo se deberá estacionar un vehículo cuando la vía es en subida?","opts":["Con las ruedas delanteras hacia la cuneta.","Con las ruedas traseras hacia la calzada.","Con las ruedas delanteras hacia la calzada."],"a":2,"page":20,"source":"CONASET cuestionario enero 2016"},{"id":125,"cat":"Normativa","q":"En un siniestro, el solo hecho de la infracción no determina:","opts":["La gravedad del siniestro.","La responsabilidad civil de la persona infractora.","Ninguna de las anteriores."],"a":1,"page":21,"source":"CONASET cuestionario enero 2016"},{"id":126,"cat":"Normativa","q":"En caso de siniestro, no prestar atención a las condiciones del tránsito, constituye:","opts":["Presunción de responsabilidad de quien conduce.","Causal de cancelación de licencia.","Ninguna de las anteriores."],"a":0,"page":21,"source":"CONASET cuestionario enero 2016"},{"id":127,"cat":"Normativa","q":"En todo siniestro en que se produzcan daños, quien o quienes participantes estarán obligados a:","opts":["Huir del sitio del suceso.","Dar cuenta a la autoridad policial más próxima.","Llamar al servicio de ambulancias."],"a":1,"page":21,"source":"CONASET cuestionario enero 2016"},{"id":128,"cat":"Normativa","q":"Se presumirá culpabilidad del peatón que cruce la calzada en:","opts":["El paso de cebra.","Paso de peatones.","Lugar prohibido."],"a":2,"page":21,"source":"CONASET cuestionario enero 2016"},{"id":129,"cat":"Normativa","q":"Se presumirá culpabilidad del peatón cuando pase por:","opts":["Delante de un vehículo detenido habiendo tránsito libre en la vía respectiva.","Detrás del vehículo en movimiento.","Ninguna de las anteriores."],"a":0,"page":21,"source":"CONASET cuestionario enero 2016"},{"id":130,"cat":"Normativa","q":"La luz verde del semáforo indica:","opts":["Prevención.","Precaución.","Paso."],"a":2,"page":21,"source":"CONASET cuestionario enero 2016"},{"id":131,"cat":"Normativa","q":"La luz amarilla del semáforo indica:","opts":["Prevención.","Paso.","Detenerse."],"a":0,"page":21,"source":"CONASET cuestionario enero 2016"},{"id":132,"cat":"Normativa","q":"¿Qué indica la luz roja del semáforo?","opts":["Detención.","Precaución.","Paso."],"a":0,"page":21,"source":"CONASET cuestionario enero 2016"},{"id":133,"cat":"Normativa","q":"¿Qué condiciones debe tener el cruce para que el vehículo continúe su marcha, no obstante tenga luz verde al frente?","opts":["Debe existir previamente luz amarilla.","Debe existir espacio suficiente para no bloquear el cruce.","No tener el paso de cebra demarcado."],"a":1,"page":22,"source":"CONASET cuestionario enero 2016"},{"id":134,"cat":"Normativa","q":"Los vehículos que enfrenten un semáforo con luz roja y flecha verde, podrán:","opts":["Entrar cuidadosamente al cruce solo para seguir en la dirección indicada en la flecha verde.","Entrar cuidadosamente al cruce para continuar directo.","Ninguna de las anteriores."],"a":0,"page":22,"source":"CONASET cuestionario enero 2016"},{"id":135,"cat":"Normativa","q":"La luz roja intermitente del semáforo indica:","opts":["Precaución.","Prevención.","Ceda el paso."],"a":2,"page":22,"source":"CONASET cuestionario enero 2016"},{"id":136,"cat":"Normativa","q":"La luz amarilla intermitente del semáforo indica:","opts":["PARE.","Peligro.","Ceda el paso."],"a":1,"page":22,"source":"CONASET cuestionario enero 2016"},{"id":137,"cat":"Normativa","q":"Indica qué significan estas señales:","opts":["Pare, Pavimento resbaladizo, Curva muy cerrada a la derecha.","Pare, Zona de curvas a la derecha, Proximidad rotonda.","Pare, Zona de curvas a la izquierda, Proximidad rotonda."],"a":2,"page":22,"source":"CONASET cue const PDF='https://mejoresconductores.conaset.cl/assets/data/pdf/A1A2/cuestionario-examen-teorico-A1-A2-D-E-enero2016.pdf';
const DIST={'Normativa':10,'Conducta vial':5,'Mecánica básica':3,'Mecánica diésel':2};
const app=document.getElementById('app'), key='mi-a1-progreso-v2';
const empty=()=>({exams:[],errors:{},seen:{},lastIds:[],lastOrder:[],answered:{}});
let db;try{db={...empty(),...JSON.parse(localStorage.getItem(key)||'{}')}}catch{db=empty()}
let s={mode:'home',items:[],answers:{},idx:0,started:0,filter:'Todas',result:null,studyShuffle:false,kind:'normal'};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(key,JSON.stringify(db))}catch{}}
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function count(id){return db.seen[id]||0}
function weightedPick(pool,n,priority={}){let chosen=[],remaining=[...pool];while(chosen.length<n&&remaining.length){const min=Math.min(...remaining.map(q=>count(q.id)));let weights=remaining.map(q=>Math.pow(0.27,count(q.id)-min)*(1+(priority[q.id]||0)*5));let total=weights.reduce((a,b)=>a+b,0),r=Math.random()*total,i=0;while(i<remaining.length-1&&r>=weights[i]){r-=weights[i];i++}chosen.push(remaining.splice(i,1)[0]);}return chosen}
function selectExam(kind='normal'){
 const target=kind==='normal'?DIST:DIST;const chosen=[];
 for(const [cat,num] of Object.entries(target)){
   const pool=QUESTIONS.filter(q=>q.cat===cat);
   if(pool.length<num)throw Error(`Faltan preguntas en ${cat}: ${pool.length} disponibles, se necesitan ${num}`);
   if(kind==='difficult'){const wrong=pool.filter(q=>(db.errors[q.id]||0)>0);const hard=weightedPick(wrong,Math.min(num,wrong.length),db.errors);const ids=new Set(hard.map(q=>q.id));chosen.push(...hard,...weightedPick(pool.filter(q=>!ids.has(q.id)),num-hard.length))}else chosen.push(...weightedPick(pool,num));
 }
 let result=shuffle(chosen);
 if(db.lastIds.length===20&&result.every((q,i)=>q.id===db.lastOrder[i]))result=shuffle(result);
 if(db.lastIds.length===20&&result.every(q=>db.lastIds.includes(q.id))){
   const alternatives=Object.entries(DIST).some(([cat,n])=>QUESTIONS.filter(q=>q.cat===cat).length>n);
   if(alternatives){
      const chosenIds=new Set(result.map(q=>q.id));
      const candidate=QUESTIONS.filter(q=>!chosenIds.has(q.id)).sort((a,b)=>count(a.id)-count(b.id));
      const replacement=candidate[0];if(replacement){const pos=result.findIndex(q=>q.cat===replacement.cat);if(pos>=0)result[pos]=replacement;result=shuffle(result)}
   }
 }
 return result;
}
function recordSeen(items){for(const q of items)db.seen[q.id]=count(q.id)+1;db.lastIds=items.map(q=>q.id);db.lastOrder=[...db.lastIds];save()}
function grade(items,answers){const correct=items.filter(q=>answers[q.id]===q.a).length;const legal=items.filter(q=>q.cat==='Normativa'&&answers[q.id]!==q.a).length;return{correct,legal,pass:correct>=17&&legal<=2,unanswered:items.filter(q=>answers[q.id]===undefined).length}}
function source(q){return `<p class="muted small">CONASET · Cuestionario A1*/A2*/D/E, edición enero 2016 · N.º ${q.id}, página ${q.page}. <a href="${PDF}#page=${q.page}" target="_blank" rel="noopener">Ver en PDF</a></p>`}
function banner(){return `<div class="note small">Banco de <b>${QUESTIONS.length} preguntas</b> extraídas del cuestionario CONASET adjunto (edición enero 2016). Se incorporaron las 8 preguntas con señales gráficas y se excluyeron 7 preguntas exclusivas de otras licencias. Las preguntas de este banco no garantizan cuáles aparecerán en la municipalidad. No se ha cotejado aún con la versión de septiembre de 2024.</div>`}
function home(){const seen=QUESTIONS.filter(q=>count(q.id)>0).length;app.innerHTML=`<section class="card"><h2>Para que don Carlos Oyarzun se saque un 7 en su prueba</h2><p class="muted">Examen de licencia A1 antigua.</p>${banner()}<div class="statgrid"><div class="stat">Preguntas vistas<strong>${seen}/${QUESTIONS.length}</strong></div><div class="stat">Simulacros hechos<strong>${db.exams.length}</strong></div></div><div class="actions"><button onclick="startExam('normal')">Simular examen A1 antigua</button><button onclick="startExam('difficult')">Examen de preguntas difíciles</button><button class="secondary" onclick="go('study')">Estudiar preguntas</button><button class="secondary" onclick="go('errors')">Practicar mis errores</button><button class="secondary" onclick="go('stats')">Ver mi progreso</button></div><p class="muted small">El examen normal mantiene 10 de normativa, 5 de conducta vial, 3 de mecánica básica y 2 diésel. El modo difícil prioriza tus errores, y puede incluir otras preguntas si no tení suficientes errores registrados. No equivale a una selección oficial de preguntas.</p><div class="actions"><button class="secondary" onclick="clearSeen()">Reiniciar historial de preguntas vistas</button></div><p class="muted small">Los datos se guardan solo en este navegador y no se sincronizan entre equipos. Independiente de CONASET.</p></section>`}
function clearSeen(){if(confirm('¿Reiniciar el historial de preguntas vistas? Tus resultados y errores seguirán guardados.')){db.seen={};db.lastIds=[];db.lastOrder=[];save();render()}}
function go(mode){s.mode=mode;if(mode==='study')setupStudy();else if(mode==='errors')setupErrors();else render()}
function startExam(kind='normal'){try{s.items=selectExam(kind)}catch(e){alert(e.message);return}s.kind=kind;recordSeen(s.items);s.idx=0;s.answers={};s.started=Date.now();s.mode='exam';render()}
function setupStudy(){s.items=s.studyShuffle?shuffle(QUESTIONS):[...QUESTIONS].sort((a,b)=>a.id-b.id);s.answers={};s.idx=0;render()}
function setupErrors(){s.items=shuffle(QUESTIONS.filter(q=>(db.errors[q.id]||0)>0));s.answers={};s.idx=0;render()}
function choose(a){const q=s.items[s.idx];if(s.mode!=='exam'&&s.answers[q.id]!==undefined)return;s.answers[q.id]=a;if(s.mode!=='exam'){db.answered[q.id]=(db.answered[q.id]||0)+1;if(a!==q.a)db.errors[q.id]=(db.errors[q.id]||0)+1;else delete db.errors[q.id];save()}render()}
function nav(dir){s.idx=Math.max(0,Math.min(s.items.length-1,s.idx+dir));render()}
function question(){if(!s.items.length){app.innerHTML=`<section class="card"><h2>No hay errores pendientes</h2><p>Estudiá o hacé un simulacro para comenzar.</p><button onclick="go('home')">Volver al inicio</button></section>`;return}
 const q=s.items[s.idx],a=s.answers[q.id],show=s.mode!=='exam'&&a!==undefined;
 app.innerHTML=`<section class="card"><p class="muted">${s.mode==='exam'?(s.kind==='difficult'?'Examen de preguntas difíciles':'Simulacro A1 antigua'):s.mode==='errors'?'Repaso de errores':'Estudio'} · Pregunta ${s.idx+1} de ${s.items.length}</p><div class="progress"><div style="width:${(s.idx+1)/s.items.length*100}%"></div></div><p class="tag">${esc(q.cat)} · CONASET N.º ${q.id}</p><h2>${esc(q.q)}</h2>${q.image?`<img src="${q.image}" alt="Señales de tránsito de la pregunta oficial ${q.id}" style="max-width:100%;height:auto;display:block;margin:1rem 0">`:``}${q.opts.map((o,i)=>`<button class="option ${a===i?'selected':''} ${show&&i===q.a?'good':''} ${show&&a===i&&i!==q.a?'bad':''}" ${show?'disabled':''} onclick="choose(${i})" aria-pressed="${a===i}"><span class="letter">${'ABC'[i]}</span> ${esc(o)}</button>`).join('')}${show?`<div class="info"><b>${a===q.a?'¡Correcto!':'Respuesta incorrecta'}</b><p>Respuesta según la pauta: <b>${'ABC'[q.a]}. ${esc(q.opts[q.a])}</b></p>${source(q)}</div>`:''}<div class="actions"><button class="secondary" onclick="nav(-1)" ${s.idx===0?'disabled':''}>← Anterior</button><button onclick="nav(1)" ${s.idx===s.items.length-1?'disabled':''}>Siguiente →</button>${s.mode==='exam'?`<button class="secondary" onclick="confirmFinish()">Finalizar examen</button>`:''}<button class="secondary" onclick="go('home')">Salir</button></div>${s.mode==='exam'?`<p class="muted">Respondidas: ${Object.keys(s.answers).length} de 20. Las omitidas se contarán como incorrectas.</p>`:source(q)}</section>`}
function confirmFinish(){let missing=s.items.filter(q=>s.answers[q.id]===undefined).length;if(missing&&!confirm(`Quedan ${missing} preguntas sin responder. ¿Finalizar de todas maneras?`))return;finish()}
function finish(){const result={...grade(s.items,s.answers),kind:s.kind,date:new Date().toISOString(),elapsed:Math.round((Date.now()-s.started)/1000),ids:s.items.map(q=>q.id)};for(const q of s.items){db.answered[q.id]=(db.answered[q.id]||0)+1;if(s.answers[q.id]!==q.a)db.errors[q.id]=(db.errors[q.id]||0)+1;else delete db.errors[q.id]};db.exams.push(result);save();s.result=result;s.mode='result';render()}
function answerList(){
 return `<div class="answer-list" aria-label="Revisión completa del examen">${s.items.map((q,i)=>{
  const a=s.answers[q.id],correct=a===q.a,omitted=a===undefined;
  const status=omitted?'Sin responder':correct?'Correcta':'Incorrecta';
  const tone=omitted?'omitted':correct?'right':'wrong';
  return `<article class="answer-card ${tone}" aria-label="Pregunta ${i+1}: ${status}">
    <div class="answer-head"><span class="answer-number">Pregunta ${i+1} de 20</span><span class="answer-state ${tone}">${correct?'✓ ':omitted?'— ':'✕ '}${status}</span></div>
    <p class="muted small">${esc(q.cat)} · CONASET N.º ${q.id}</p>
    <h3 class="answer-question">${esc(q.q)}</h3>
    ${q.image?`<img class="answer-image" src="${q.image}" alt="Señales del cuestionario oficial, pregunta ${q.id}">`:''}
    <div class="answer-options">${q.opts.map((opt,j)=>{
      const isCorrect=j===q.a,isChosen=j===a;
      const cls=isCorrect?'answer-opt correct-opt':isChosen?'answer-opt incorrect-opt':'answer-opt';
      return `<div class="${cls}"><span class="letter">${'ABC'[j]}</span><span>${esc(opt)}</span>${isCorrect?'<strong class="opt-note">✓ Correcta</strong>':isChosen?'<strong class="opt-note">✕ Tu elección</strong>':''}</div>`;
    }).join('')}</div>
    <p class="answer-explanation">${omitted?'No seleccionaste ninguna respuesta. ':correct?'¡Muy bien! ':'Tu respuesta fue incorrecta. '}<strong>Respuesta oficial: ${'ABC'[q.a]}. ${esc(q.opts[q.a])}</strong></p>
    ${source(q)}
  </article>`;
 }).join('')}</div>`
}
function mensajeResultado(r){
 const fallos=20-r.correct;
 if(fallos===0)return '¡Te fue pulento! ¡Las 20 buenas!';
 if(fallos===1)return '¡Te fue pulento! Te equivocaste en una nomás.';
 if(fallos===2)return '¡Muy bien! Te equivocaste en dos nomás.';
 if(r.pass)return '¡Buena! Aprobaste la prueba.';
 if(r.correct>=17)return '¡Casi! Ojo con las preguntas de normativa.';
 if(r.correct>=14)return '¡Falta mejorar un poco! Vas por buen camino.';
 if(r.correct>=10)return 'Hay que repasar un poquito más. ¡A seguir practicando!';
 return 'Todavía falta práctica. Vamos de nuevo.';
}
function notaPractica(correct){return (1+6*correct/20).toFixed(1)}
function results(){
 let r=s.result;
 app.innerHTML=`<section class="card"><span class="pill ${r.pass?'pass':'fail'}">${r.pass?'APROBADO':'REPROBADO'}</span><h2>${r.correct}/20 correctas</h2><div class="nota-practica" aria-label="Nota de práctica ${notaPractica(r.correct)} de 7"><span>Nota de práctica</span><strong>${notaPractica(r.correct)}</strong><small>Escala ilustrativa 1,0 a 7,0 · No es nota oficial ni cambia la aprobación</small></div><div class="celebracion ${r.pass?'celebracion-ok':'celebracion-animo'}" role="status"><strong>${mensajeResultado(r)}</strong></div><p>${r.legal} errores u omisiones en normativa. Requisito: 17 respuestas correctas y no más de 2 errores legales.</p><div class="statgrid"><div class="stat">Incorrectas<strong>${20-r.correct-r.unanswered}</strong></div><div class="stat">Sin responder<strong>${r.unanswered}</strong></div><div class="stat">Tiempo de práctica<strong>${Math.floor(r.elapsed/60)}m ${r.elapsed%60}s</strong></div></div><h3>Resultados por categoría</h3>${Object.entries(DIST).map(([cat,n])=>`<p>${cat}: ${s.items.filter(q=>q.cat===cat&&s.answers[q.id]===q.a).length}/${n}</p>`).join('')}<div class="actions"><button onclick="startExam(s.kind)">Otro examen</button><button class="secondary" onclick="go('errors')">Practicar errores</button><button class="secondary" onclick="go('home')">Inicio</button></div></section>
 <section class="card" id="correccion-completa"><h2>Revisión de las 20 preguntas</h2><p>Deslizá hacia abajo para revisar una por una todas tus respuestas. <strong>Verde</strong> indica la respuesta correcta, y <strong>rojo</strong> indica tu elección equivocada. También aparecen las preguntas sin responder.</p><div class="review-legend"><span class="answer-state right">✓ Correcta</span><span class="answer-state wrong">✕ Incorrecta</span><span class="answer-state omitted">— Sin responder</span></div>${answerList()}<div class="actions"><button class="secondary" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ Volver arriba</button><button onclick="startExam(s.kind)">Hacer otro examen</button></div></section>`;
}
function reviewPage(){const q=s.items[s.idx],a=s.answers[q.id];app.innerHTML=`<section class="card"><p>Corrección ${s.idx+1} de 20 · ${esc(q.cat)}</p><h2>${esc(q.q)}</h2>${q.image?`<img src="${q.image}" alt="Señales de tránsito de la pregunta oficial ${q.id}" style="max-width:100%;height:auto;display:block;margin:1rem 0">`:``}${q.opts.map((o,i)=>`<div class="option ${i===q.a?'good':i===a?'bad':''}"><span class="letter">${'ABC'[i]}</span> ${esc(o)}</div>`).join('')}<p>${a===undefined?'Sin responder':a===q.a?'Correcta':'Incorrecta'} · Respuesta oficial: <b>${'ABC'[q.a]}</b></p>${source(q)}<div class="actions"><button class="secondary" onclick="nav(-1)" ${s.idx===0?'disabled':''}>Anterior</button><button onclick="nav(1)" ${s.idx===19?'disabled':''}>Siguiente</button><button class="secondary" onclick="s.mode='result';render()">Resumen</button></div></section>`}
function stats(){const ex=db.exams,passed=ex.filter(x=>x.pass).length,seen=QUESTIONS.filter(q=>count(q.id)>0).length;app.innerHTML=`<section class="card"><h2>Mi progreso</h2><p class="muted">Se conserva en este dispositivo mientras no borres los datos del navegador.</p><div class="statgrid"><div class="stat">Simulacros<strong>${ex.length}</strong></div><div class="stat">Aprobados<strong>${passed}</strong></div><div class="stat">Promedio<strong>${ex.length?(ex.reduce((s,x)=>s+x.correct,0)/ex.length).toFixed(1):'—'}</strong></div><div class="stat">Mejor<strong>${ex.length?Math.max(...ex.map(x=>x.correct))+'/20':'—'}</strong></div><div class="stat">Preguntas vistas<strong>${seen}/${QUESTIONS.length}</strong></div><div class="stat">Errores por repasar<strong>${Object.keys(db.errors).length}</strong></div></div><h3>Últimos exámenes</h3>${ex.slice(-12).reverse().map(x=>`<p>${new Date(x.date).toLocaleDateString('es-CL')} · ${x.correct}/20 · ${x.pass?'Aprobado':'Reprobado'} · ${x.kind==='difficult'?'Difícil':'Normal'}</p>`).join('')||'<p>Sin exámenes aún</p>'}<h3>Preguntas pendientes de ver</h3><p>${QUESTIONS.length-seen} sin aparecer en simulacros.</p><div class="actions"><button onclick="go('home')">Inicio</button><button class="secondary" onclick="clearSeen()">Reiniciar vistas</button><button class="red" onclick="clearAll()">Borrar todo mi progreso</button></div></section>`}
function clearAll(){if(confirm('¿Borrar todos los exámenes, errores e historial de vistas?')){db=empty();save();render()}}
function render(){if(s.mode==='home')home();else if(['exam','study','errors'].includes(s.mode))question();else if(s.mode==='result')results();else if(s.mode==='review')reviewPage();else if(s.mode==='stats')stats()}
render();

</script></body></html>
